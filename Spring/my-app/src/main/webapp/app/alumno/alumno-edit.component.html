<div class="d-flex flex-wrap mb-4">
    <h1 class="flex-grow-1" i18n="@@alumno.edit.headline">Edit Alumno</h1>
    <div>
        <a routerLink="/alumnoes" class="btn btn-secondary" i18n="@@alumno.edit.back">Back to list</a>
    </div>
</div>
<form [formGroup]="editForm" (ngSubmit)="handleSubmit()">
    <app-input-row [group]="editForm" field="id" rowType="number" i18n-label="@@alumno.id.label" label="Id" />
    <app-input-row [group]="editForm" field="name" i18n-label="@@alumno.name.label" label="Name" />
    <app-input-row [group]="editForm" field="mail" i18n-label="@@alumno.mail.label" label="Mail" />
    <app-input-row [group]="editForm" field="curso" rowType="select" [options]="cursoValues" i18n-label="@@alumno.curso.label" label="Curso" />
    <input type="submit" i18n-value="@@alumno.edit.headline" value="Edit Alumno" class="btn btn-primary mt-4" />
</form>
